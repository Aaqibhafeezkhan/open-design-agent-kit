<!doctype html>
<html><head><meta charset="utf-8"><title>App</title></head>
<body>
<div id="root"></div>
<script>
  // Styles injected at runtime under generated class names, as CSS-in-JS libraries do.
  const css = `.c-a1 { background: #0b0d12; min-height: 100vh; color: #e6e8ee; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  .c-b2 { background-color: #7c5cff; color: #ffffff; padding: 10px 20px; border-radius: 9999px; border: 0; font-size: 14px; }
  .c-c3 { background: #151922; border: 1px solid #262b36; border-radius: 12px; padding: 20px; margin: 16px; width: 480px; }
  .c-d4 { font-size: 40px; line-height: 44px; }`;
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
  document.getElementById('root').innerHTML = `<div class="c-a1"><h1 class="c-d4">Ship faster</h1>
    <p>The platform for teams who build with data, from the first query to production dashboards.</p>
    <button class="c-b2">Start building</button>
    <div class="c-c3"><p>Connect your warehouse in two minutes and get alerts when numbers drift.</p></div></div>`;
</script>
</body></html>
