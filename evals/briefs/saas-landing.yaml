id: saas-landing
request: "Build a landing page for Ledgerly, our bookkeeping app for freelancers. It connects to your bank and gets your tax return ready."
expect:
  surface: prototype
  skills: [saas-landing, web-prototype]
  questions: { max: 1 }
designSystem: null
answers:
  audience: "UK freelancers and sole traders"
  style: "you pick"
  cta: "Start a free 30-day trial"
must:
  - "Says what it does and for whom above the fold"
  - "One primary call to action, repeated at the end"
  - "Works at phone width without sideways scrolling"
